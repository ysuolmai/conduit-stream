; Conduit Stream - PlatformIO project
; Board: ESP32-S3 Super Mini N4R2 (4 MB flash, 2 MB quad PSRAM)
; Framework: ESP-IDF (per the Vision doc)
;
; First build downloads the Xtensa toolchain + ESP-IDF; give it a few minutes.
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor   (115200 baud)

[env:esp32-s3-n4r2-max98357a]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; N4R2: 4 MB flash + 2 MB quad PSRAM.
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions-n4r2.csv
board_build.psram_type = qspi
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.n4r2-max98357a"

monitor_speed = 115200

[env:esp32-s3-n4r2-pcm5102a]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; N4R2: 4 MB flash + 2 MB quad PSRAM.
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions-n4r2.csv
board_build.psram_type = qspi
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.n4r2-pcm5102a"

monitor_speed = 115200

; --- Host unit tests (pure-C logic only; no ESP-IDF). Run: pio test -e native ---
[env:native]
platform = native
; Exclude the ESP-IDF app sources; native tests compile only test/ + the pure unit
; they #include directly. Keeps host builds free of ESP-IDF headers.
build_src_filter = -<*>
build_flags = -I components/audio/src -I components/system/src -I components/system/include -I components/discovery/src -I components/raop/src -I components/alac/include -I components/alac/src -std=gnu11
