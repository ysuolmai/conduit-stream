; Conduit Stream - PlatformIO project
; Board: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
; Framework: ESP-IDF (per the Vision doc)
;
; First build downloads the Xtensa toolchain + ESP-IDF; give it a few minutes.
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor   (115200 baud)

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; --- Flash: 16 MB, QIO ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; --- PSRAM: 8 MB octal (OPI). The real config lives in sdkconfig.defaults;
;     this hint helps the PlatformIO board resolver. ---
board_build.psram_type = opi

; --- Serial ---
monitor_speed = 115200
; Uncomment and set your port if auto-detect misses it:
; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101

; Native-USB S3 devkits enumerate as USB-CDC. If your first serial log is missing
; the first few lines, route the console over the built-in USB Serial/JTAG by
; setting it in sdkconfig.defaults (Kconfig), NOT as a -D build flag:
;   CONFIG_ESP_CONSOLE_UART_DEFAULT=n
;   CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y

; --- Host unit tests (pure-C logic only; no ESP-IDF). Run: pio test -e native ---
[env:native]
platform = native
; Exclude the ESP-IDF app sources; native tests compile only test/ + the pure unit
; they #include directly. Keeps host builds free of ESP-IDF headers.
build_src_filter = -<*>
build_flags = -I components/audio/src -I components/system/src -I components/discovery/src -std=gnu11
